steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/github.com/amumm/foundry-server:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/github.com/amumm/foundry-server:latest"
      - "-f"
      - "Dockerfile"
      - "."

  # Push the container image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/github.com/amumm/foundry-server:$COMMIT_SHA"

  # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "foundry-server"
      - "--image"
      - "gcr.io/$PROJECT_ID/github.com/amumm/foundry-server:$COMMIT_SHA"
      - "--region"
      - "northamerica-northeast2"
      - "--port"
      - "30000"
      - "--allow-unauthenticated"
      - "--platform"
      - "managed"
      - "--execution-environment=gen2"
      - "--add-volume=name=foundry-data,type=cloud-storage,bucket=foundry-server-data-476001"
      - "--add-volume-mount=volume=foundry-data,mount-path=/app/data"
      - "--add-volume=name=foundry-packages,type=cloud-storage,bucket=foundry-server-packages-476001"
      - "--add-volume-mount=volume=foundry-packages,mount-path=/app/packages"
      - "--min-instances=1"
      - "--max-instances=1"

images:
  - "gcr.io/$PROJECT_ID/github.com/amumm/foundry-server:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/github.com/amumm/foundry-server:latest"

options:
  logging: CLOUD_LOGGING_ONLY
